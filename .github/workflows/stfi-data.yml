name: Dati STFI giornalieri

# Scarica ogni sera il file "End of Day" di simpletoolsforinvestors.eu e lo pubblica
# in data/ per l'app. I dati escono verso le 19 (ora italiana): primo tentativo alle
# 19:40 d'estate / 18:40 d'inverno, secondo tentativo in tarda serata.
on:
  schedule:
    - cron: '40 17 * * 1-5'
    - cron: '10 21 * * 1-5'
  workflow_dispatch:
  push:
    branches-ignore: [main]          # sui branch di lavoro: solo prova a vuoto
    paths:
      - scripts/fetch_stfi.py
      - .github/workflows/stfi-data.yml

permissions:
  contents: write

concurrency:
  group: stfi-data
  cancel-in-progress: false

jobs:
  scarica:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Scarica e controlla il file del giorno
        run: |
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            python3 scripts/fetch_stfi.py --out data
          else
            python3 scripts/fetch_stfi.py --out data --dry-run
          fi

      - name: Pubblica i dati (solo su main)
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stfi-latest.csv data/stfi-latest.json
          if git diff --cached --quiet; then
            echo "Nessun aggiornamento."
            exit 0
          fi
          REF=$(python3 -c "import json; print(json.load(open('data/stfi-latest.json'))['refDate'])")
          git commit -m "Dati STFI del $REF"
          git push
