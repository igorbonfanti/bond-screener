<!DOCTYPE html>
<html lang="it" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1117">
  <meta name="description" content="Costruisci una scala di titoli di Stato (bond ladder) per avere capitale a scadenze precise o una rendita mensile, con i dati di simpletoolsforinvestors.eu e le tasse italiane già calcolate.">
  <title>Bond Ladder — scale di titoli di Stato</title>
  <script>(function(){try{var t=localStorage.getItem('antigravity-theme')||'dark';document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./assets/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles/app.css">
  <script type="module" src="./src/main.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/" aria-label="Bond Ladder, costruttore">
      <span id="brandLogo"></span>
      <span class="brand-text"><span class="brand-name">Bond Ladder</span><span class="brand-sub">scale di titoli di Stato · capitale o rendita</span></span>
    </a>
    <nav class="nav" aria-label="Sezioni">
      <a href="#/" data-route="build">Costruisci</a>
      <a href="#/scale" data-route="saved"><span class="long">Le mie scale</span><span class="short">Scale</span></a>
    </nav>
    <div class="top-actions">
      <button id="dataPill" class="data-pill" type="button" title="Dati del giorno: origine e aggiornamento"></button>
      <button id="helpBtn" class="icon-btn" type="button" title="Come sceglie i titoli" aria-label="Come funziona">?</button>
      <button id="themeToggle" class="icon-btn" type="button" title="Cambia tema chiaro / scuro" aria-label="Cambia tema">🌙</button>
    </div>
  </header>

  <main id="app" aria-live="polite">
    <noscript><div class="card card-pad">Serve JavaScript per usare l'app.</div></noscript>
  </main>

  <footer class="footer">
    <span>Dati: <a href="https://www.simpletoolsforinvestors.eu/documentivari.php" target="_blank" rel="noopener">simpletoolsforinvestors.eu</a></span>
    <span>Calcoli indicativi, non consulenza finanziaria · commissioni e imposta di bollo escluse · <a href="#" id="helpLink">come funziona</a></span>
    <span><span id="version"></span> · versioni precedenti: <a href="./v2/">v2</a> · <a href="./v1/">v1</a></span>
  </footer>

  <div class="mobile-bar" id="mobileBar" hidden>
    <div class="mb-text"><span class="mb-main" id="mbMain">—</span><span class="mb-sub" id="mbSub"></span></div>
    <button class="btn btn-primary btn-sm" id="mbBtn" type="button">Vedi proposta ↓</button>
  </div>

  <!-- Firebase (facoltativo): salvataggio, condivisione e monitoraggio delle scale -->
  <script defer src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <!-- Accesso opzionale (condiviso con coma-screener): serve solo per salvare ed eliminare -->
  <script defer src="./auth-opzionale.js"></script>
  <script>
    if ('serviceWorker' in navigator) window.addEventListener('load', function () { navigator.serviceWorker.register('./sw.js').catch(function () {}); });
  </script>
</body>
</html>
